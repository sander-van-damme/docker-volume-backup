# A stack that uses an external volume — a common pattern for data you want
# to survive `docker compose down -v`.
services:
  backup:
    image: ${DVB_IMAGE:-dvb:test}
    restart: unless-stopped
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: dvblab
      S3_PREFIX: ext
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      BACKUP_CRON: "0 4 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backup-staging:/staging
    networks: [default, s3]

  app:
    image: alpine:3.22
    init: true
    command: sh -c '[ -f /ext/payload ] || echo FRESH > /ext/payload; [ -f /own/payload ] || echo FRESH > /own/payload; sleep infinity'
    volumes:
      - important:/ext
      - own-data:/own
    depends_on:
      backup:
        condition: service_healthy

networks:
  s3:
    external: true
    name: dvblab-s3

volumes:
  backup-staging:
  own-data:
  important:
    external: true
    name: dvblab-important
